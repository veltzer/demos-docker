# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

[processor.generator.tera]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["exercises", "notes", "compose", "examples"]
src_files = ["README.md"]

[processor.checker.zspell]
src_dirs = ["exercises", "notes"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.checker.ruff]
src_dirs = ["scripts", "config", "exercises"]


[processor.checker.pyrefly]
src_dirs = ["scripts", "config", "exercises"]

# ─── shell ───────────────────────────────────────────────────────────────────

# external_sources lets ishellcheck follow the tracked .env files that the
# compose exercises source, so their variables are seen as assigned.
[processor.checker.ishellcheck]
src_dirs = ["scripts", "exercises", "config", "compose", "examples", "fun"]
src_files = [".auto.enter.sh", ".auto.exit.sh"]
external_sources = true

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.checker.iluacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_dirs = ["compose", "exercises"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.checker.idockerfile]
src_dirs = ["compose", "examples", "exercises"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.checker.ijsonlint]
src_dirs = ["compose/exercises/nodejs_postgresql/app", "exercises/nodejs"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.ixmllint]
src_dirs = ["exercises/java_build_maven_in_docker"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.checker.cppcheck]
src_dirs = ["examples", "exercises"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checker.icheckstyle]
src_dirs = ["exercises"]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.checker.itidy]
src_dirs = ["compose/exercises/cors"]

# ─── css ─────────────────────────────────────────────────────────────────────

# Only .css is passed: .biome.jsonc turns biome's JavaScript and JSON linters
# off, oxlint covers JavaScript and ijsonlint covers JSON.
[processor.checker.biome]
src_dirs = ["examples/hello_dotnet_build_and_run/test/Styles"]
src_extensions = [".css"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.checker.oxlint]
src_dirs = ["compose/exercises", "examples/hello_dotnet_build_and_run/test/Scripts", "exercises/nodejs"]
args = ["-c", ".oxlintrc.json"]
